name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v2.19.0)'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "❌ Release tag is empty"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.vars.outputs.tag }}"
          REPO="${{ github.repository }}"
          ASSET_DIR="./release_assets"

          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"

          echo "=== Downloading GitHub Release assets ==="
          echo "Repo: $REPO"
          echo "Tag: $TAG"

          # Try GitHub CLI first.
          if gh release download "$TAG" \
              --repo "$REPO" \
              --dir "$ASSET_DIR" \
              --clobber; then
            echo "Downloaded via gh CLI"
          else
            echo "⚠️ gh CLI download failed, falling back to GitHub REST API..."

            RELEASE_JSON=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG")

            ASSET_COUNT=$(echo "$RELEASE_JSON" | jq '.assets | length')

            if [ "$ASSET_COUNT" -eq 0 ]; then
              echo "No GitHub Release assets found."
            else
              echo "Found $ASSET_COUNT GitHub Release assets."

              echo "$RELEASE_JSON" |
                jq -r '.assets[] | [.url, .name] | @tsv' |
                while IFS=$'\t' read -r ASSET_URL ASSET_NAME; do
                  echo "Downloading $ASSET_NAME..."

                  curl -fsSL \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/octet-stream" \
                    "$ASSET_URL" \
                    -o "$ASSET_DIR/$ASSET_NAME"
                done
            fi
          fi

          echo
          echo "Downloaded assets:"
          ls -lah "$ASSET_DIR"

      - name: Sync Release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: h1985/DwgSearch
          GH_RELEASE_NAME: ${{ github.event.release.name }}
          GH_RELEASE_BODY: ${{ github.event.release.body }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Syncing Gitee release for $TAG ==="
          echo "Repo: $REPO"
          echo "Tag: $TAG"

          # ------------------------------------------------------------
          # Determine release name and body.
          # ------------------------------------------------------------
          if [ "${{ github.event_name }}" = "release" ]; then
            NAME="${GH_RELEASE_NAME:-DwgSearch $TAG}"
            BODY="${GH_RELEASE_BODY:-}"
          else
            NAME="DwgSearch $TAG"
            BODY="Automated sync from GitHub Release $TAG. See [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/$TAG) for details."
          fi

          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          printf '%s' "$BODY" > "$BODY_FILE"

          echo "Name: $NAME"

          # ------------------------------------------------------------
          # Gitee API helper.
          #
          # IMPORTANT:
          #   This function does NOT return HTTP errors through "return 1".
          #   It always prints the response body and stores the HTTP status
          #   in the caller through GITEE_HTTP_CODE.
          #
          #   This avoids conflicts between curl/API errors and "set -e".
          # ------------------------------------------------------------
          # IMPORTANT:
          # Do NOT call this function through command substitution such as:
          #   RESPONSE=$(gitee_api GET "...")
          # Bash runs command substitutions in a subshell, so variables set
          # inside the function would be lost.
          #
          # Correct usage:
          #   gitee_api GET "..."
          #   RESPONSE="$GITEE_RESPONSE"
          #   CODE="$GITEE_HTTP_CODE"
          gitee_api() {
            local method="$1"
            local url="$2"
            local data="${3:-}"

            local tmp_body
            local curl_exit
            local http_code

            tmp_body=$(mktemp)

            if [ -n "$data" ]; then
              set +e
              http_code=$(curl -sS \
                --connect-timeout 15 \
                --max-time 120 \
                -X "$method" \
                "$url" \
                -H "Authorization: token $GITEE_TOKEN" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "$data" \
                -o "$tmp_body" \
                -w '%{http_code}')
              curl_exit=$?
              set -e
            else
              set +e
              http_code=$(curl -sS \
                --connect-timeout 15 \
                --max-time 120 \
                -X "$method" \
                "$url" \
                -H "Authorization: token $GITEE_TOKEN" \
                -H "Accept: application/json" \
                -o "$tmp_body" \
                -w '%{http_code}')
              curl_exit=$?
              set -e
            fi

            GITEE_HTTP_CODE="$http_code"
            GITEE_RESPONSE="$(cat "$tmp_body")"
            rm -f "$tmp_body"

            if [ "$curl_exit" -ne 0 ]; then
              GITEE_HTTP_CODE="000"
              GITEE_RESPONSE="${GITEE_RESPONSE:-curl failed with exit code $curl_exit}"
            fi
          }

          # ------------------------------------------------------------
          # Build release JSON.
          # ------------------------------------------------------------
          CREATE_DATA=$(jq -n \
            --arg tag "$TAG" \
            --arg name "$NAME" \
            --rawfile body "$BODY_FILE" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body,
              prerelease: false,
              target_commitish: "main"
            }')

          UPDATE_DATA=$(jq -n \
            --arg tag "$TAG" \
            --arg name "$NAME" \
            --rawfile body "$BODY_FILE" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body
            }')

          # ------------------------------------------------------------
          # Check whether the Gitee Release already exists.
          # ------------------------------------------------------------
          echo
          echo "=== Checking existing Gitee release ==="

          gitee_api GET \
            "https://gitee.com/api/v5/repos/$REPO/releases/tags/$TAG"

          RESPONSE="$GITEE_RESPONSE"
          CHECK_CODE="$GITEE_HTTP_CODE"

          echo "Gitee GET /releases/tags/$TAG -> HTTP $CHECK_CODE"

          RELEASE_ID=""

          case "$CHECK_CODE" in
            200)
              RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

              if [ -z "$RELEASE_ID" ]; then
                echo "❌ Gitee returned HTTP 200 but no release ID was found."
                echo "Response:"
                echo "$RESPONSE"
                exit 1
              fi

              echo "Release exists: id=$RELEASE_ID"
              ;;

            404)
              echo "Release does not exist. It will be created."
              ;;

            401|403)
              echo "❌ Gitee authentication/permission error (HTTP $CHECK_CODE)."
              echo "$RESPONSE"
              exit 1
              ;;

            429)
              echo "❌ Gitee API rate limit reached (HTTP 429)."
              echo "$RESPONSE"
              exit 1
              ;;

            500|502|503|504)
              echo "❌ Gitee server error while checking release (HTTP $CHECK_CODE)."
              echo "$RESPONSE"
              exit 1
              ;;

            *)
              echo "❌ Unexpected Gitee response while checking release (HTTP $CHECK_CODE)."
              echo "$RESPONSE"
              exit 1
              ;;
          esac

          # ------------------------------------------------------------
          # Create or update release.
          # ------------------------------------------------------------
          if [ -n "$RELEASE_ID" ]; then
            echo
            echo "=== Updating existing Gitee release ==="

            gitee_api PATCH \
              "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID" \
              "$UPDATE_DATA"

            RESPONSE="$GITEE_RESPONSE"
            PATCH_CODE="$GITEE_HTTP_CODE"

            echo "Gitee PATCH release -> HTTP $PATCH_CODE"

            if [ "$PATCH_CODE" -lt 200 ] || [ "$PATCH_CODE" -ge 300 ]; then
              echo "❌ Failed to update Gitee release."
              echo "$RESPONSE"
              exit 1
            fi

            UPDATED_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

            if [ -n "$UPDATED_ID" ] && [ "$UPDATED_ID" != "$RELEASE_ID" ]; then
              echo "⚠️ Gitee returned a different release ID after update."
              echo "Expected: $RELEASE_ID"
              echo "Returned: $UPDATED_ID"
              exit 1
            fi

            echo "✅ Release updated successfully."

          else
            echo
            echo "=== Creating new Gitee release ==="

            gitee_api POST \
              "https://gitee.com/api/v5/repos/$REPO/releases" \
              "$CREATE_DATA"

            RESPONSE="$GITEE_RESPONSE"
            CREATE_CODE="$GITEE_HTTP_CODE"

            echo "Gitee POST release -> HTTP $CREATE_CODE"

            if [ "$CREATE_CODE" -lt 200 ] || [ "$CREATE_CODE" -ge 300 ]; then
              echo "❌ Failed to create Gitee release."
              echo "$RESPONSE"
              exit 1
            fi

            RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              echo "❌ Gitee created the release but no release ID was returned."
              echo "$RESPONSE"
              exit 1
            fi

            echo "✅ Created Gitee release: id=$RELEASE_ID"
          fi

          # ------------------------------------------------------------
          # Verify release.
          # ------------------------------------------------------------
          echo
          echo "=== Verifying Gitee release ==="

          gitee_api GET \
            "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID"

          VERIFY="$GITEE_RESPONSE"
          VERIFY_CODE="$GITEE_HTTP_CODE"

          if [ "$VERIFY_CODE" -lt 200 ] || [ "$VERIFY_CODE" -ge 300 ]; then
            echo "❌ Release verification failed (HTTP $VERIFY_CODE)."
            echo "$VERIFY"
            exit 1
          fi

          VERIFY_ID=$(echo "$VERIFY" | jq -r '.id // empty')
          ASSETS_URL=$(echo "$VERIFY" | jq -r '.assets_url // empty')
          HTML_URL=$(echo "$VERIFY" | jq -r '.html_url // empty')

          if [ "$VERIFY_ID" != "$RELEASE_ID" ]; then
            echo "❌ Release ID mismatch."
            echo "Expected: $RELEASE_ID"
            echo "Returned: $VERIFY_ID"
            exit 1
          fi

          echo "Release verified: id=$VERIFY_ID"
          echo "Assets URL: ${ASSETS_URL:-<none>}"
          echo "HTML URL: ${HTML_URL:-<none>}"

          # ------------------------------------------------------------
          # Get existing assets and delete them.
          #
          # This makes manual re-sync idempotent:
          # old assets -> delete -> upload current GitHub assets.
          # ------------------------------------------------------------
          echo
          echo "=== Checking existing Gitee assets ==="

          gitee_api GET \
            "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/assets"

          ASSETS_RESPONSE="$GITEE_RESPONSE"
          ASSETS_CODE="$GITEE_HTTP_CODE"

          if [ "$ASSETS_CODE" -ne 200 ]; then
            echo "❌ Failed to retrieve existing Gitee assets (HTTP $ASSETS_CODE)."
            echo "$ASSETS_RESPONSE"
            exit 1
          fi

          ASSET_IDS=$(echo "$ASSETS_RESPONSE" |
            jq -r 'if type == "array" then .[]?.id else empty end')

          if [ -z "$ASSET_IDS" ]; then
            echo "No existing Gitee assets."
          else
            while IFS= read -r asset_id; do
              [ -z "$asset_id" ] && continue

              echo "Deleting existing asset: $asset_id"

              gitee_api DELETE \
                "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/assets/$asset_id"

              DELETE_RESPONSE="$GITEE_RESPONSE"
              DELETE_CODE="$GITEE_HTTP_CODE"

              if [ "$DELETE_CODE" -lt 200 ] || [ "$DELETE_CODE" -ge 300 ]; then
                echo "❌ Failed to delete existing asset $asset_id (HTTP $DELETE_CODE)."
                echo "$DELETE_RESPONSE"
                exit 1
              fi

              echo "  ✅ Deleted asset $asset_id"
            done <<< "$ASSET_IDS"
          fi

          # ------------------------------------------------------------
          # Upload GitHub Release assets.
          # ------------------------------------------------------------
          echo
          echo "=== Uploading assets to Gitee ==="

          shopt -s nullglob
          ASSETS=(./release_assets/*)
          shopt -u nullglob

          UPLOAD_COUNT=0

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No GitHub Release assets to upload."
          else
            for asset in "${ASSETS[@]}"; do
              [ -f "$asset" ] || continue

              filename="$(basename "$asset")"
              echo
              echo "Uploading: $filename"
              echo "Size: $(du -h "$asset" | cut -f1)"

              UPLOAD_RESPONSE=$(curl -sS \
                --connect-timeout 15 \
                --max-time 900 \
                -X POST \
                "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/assets" \
                -H "Authorization: token $GITEE_TOKEN" \
                -F "file=@$asset" \
                -F "name=$filename" \
                -w $'\n%{http_code}')

              UPLOAD_CODE=$(printf '%s\n' "$UPLOAD_RESPONSE" | tail -n 1)
              UPLOAD_BODY=$(printf '%s\n' "$UPLOAD_RESPONSE" | sed '$d')

              echo "Upload HTTP status: $UPLOAD_CODE"

              if [ "$UPLOAD_CODE" -ge 200 ] && [ "$UPLOAD_CODE" -lt 300 ]; then
                echo "  ✅ Uploaded $filename"
                UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
                continue
              fi

              echo "  ⚠️ Primary upload URL failed."
              echo "  Response: $UPLOAD_BODY"

              # Try the release's assets_url as a fallback if Gitee
              # provides one.
              if [ -n "$ASSETS_URL" ] && [ "$ASSETS_URL" != "null" ]; then
                echo "  Trying alternative assets URL: $ASSETS_URL"

                ALT_RESPONSE=$(curl -sS \
                  --connect-timeout 15 \
                  --max-time 900 \
                  -X POST \
                  "$ASSETS_URL" \
                  -H "Authorization: token $GITEE_TOKEN" \
                  -F "file=@$asset" \
                  -F "name=$filename" \
                  -w $'\n%{http_code}')

                ALT_CODE=$(printf '%s\n' "$ALT_RESPONSE" | tail -n 1)
                ALT_BODY=$(printf '%s\n' "$ALT_RESPONSE" | sed '$d')

                echo "Alternative upload HTTP status: $ALT_CODE"

                if [ "$ALT_CODE" -ge 200 ] && [ "$ALT_CODE" -lt 300 ]; then
                  echo "  ✅ Uploaded $filename via alternative URL"
                  UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
                  continue
                fi

                echo "  ❌ Alternative upload also failed."
                echo "  Response: $ALT_BODY"
              fi

              echo "❌ Upload failed for $filename."
              exit 1
            done
          fi

          # ------------------------------------------------------------
          # Final verification.
          # ------------------------------------------------------------
          echo
          echo "=== Final verification ==="

          gitee_api GET \
            "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/assets"

          FINAL_RESPONSE="$GITEE_RESPONSE"
          FINAL_CODE="$GITEE_HTTP_CODE"

          if [ "$FINAL_CODE" -ne 200 ]; then
            echo "❌ Final asset verification failed (HTTP $FINAL_CODE)."
            echo "$FINAL_RESPONSE"
            exit 1
          fi

          FINAL_COUNT=$(echo "$FINAL_RESPONSE" |
            jq 'if type == "array" then length else 0 end')

          echo "Gitee asset count: $FINAL_COUNT"
          echo "Assets uploaded in this run: $UPLOAD_COUNT"

          if [ "$FINAL_COUNT" -ne "$UPLOAD_COUNT" ]; then
            echo "❌ Final asset count does not match upload count."
            echo "Expected: $UPLOAD_COUNT"
            echo "Actual:   $FINAL_COUNT"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "✅ Gitee release $TAG synced successfully"
          echo "Assets uploaded: $UPLOAD_COUNT"
          echo "Release URL: https://gitee.com/$REPO/releases/tag/$TAG"
          echo "=========================================="
