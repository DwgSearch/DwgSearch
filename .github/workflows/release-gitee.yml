name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v2.19.0)'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "❌ Release tag is empty"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.vars.outputs.tag }}"
          REPO="${{ github.repository }}"
          ASSET_DIR="./release_assets"

          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"

          echo "=== Downloading GitHub Release assets ==="
          gh release download "$TAG" --repo "$REPO" --dir "$ASSET_DIR" --clobber

          echo "Downloaded assets:"
          ls -lah "$ASSET_DIR"

      - name: Sync Release and Upload Assets to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: h1985/DwgSearch
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          TMP_JSON=$(mktemp)
          trap 'rm -f "$TMP_JSON"' EXIT

          echo "=== Fetching GitHub Release details ==="
          RELEASE_JSON=$(curl -fsSL "https://api.github.com/repos/$GH_REPO/releases/tags/$TAG")
          RELEASE_NAME=$(echo "$RELEASE_JSON" | jq -r '.name // "$TAG"')
          RELEASE_BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""')

          echo "=== Checking Gitee release status ==="
          EXIST_RELEASE=$(curl -s -H "Authorization: token $GITEE_TOKEN" \
            "https://gitee.com/api/v5/repos/$REPO/releases/tags/$TAG")

          RELEASE_ID=$(echo "$EXIST_RELEASE" | jq -r '.id // empty')

          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Found existing Release on Gitee (ID: $RELEASE_ID). Updating release info..."
            jq -n --arg name "$RELEASE_NAME" --arg body "$RELEASE_BODY" \
              '{name: $name, body: $body}' > "$TMP_JSON"

            curl -s -X PATCH "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID" \
              -H "Authorization: token $GITEE_TOKEN" \
              -H "Content-Type: application/json" \
              -d @"$TMP_JSON" > /dev/null
          else
            echo "Creating new Release on Gitee..."
            jq -n --arg tag "$TAG" --arg name "$RELEASE_NAME" --arg body "$RELEASE_BODY" \
              '{tag_name: $tag, name: $name, body: $body, target_commitish: "main"}' > "$TMP_JSON"

            NEW_RELEASE=$(curl -s -X POST "https://gitee.com/api/v5/repos/$REPO/releases" \
              -H "Authorization: token $GITEE_TOKEN" \
              -H "Content-Type: application/json" \
              -d @"$TMP_JSON")
            RELEASE_ID=$(echo "$NEW_RELEASE" | jq -r '.id // empty')
          fi

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "❌ Failed to get or create Gitee Release ID."
            exit 1
          fi

          echo "=== Cleaning old attachments on Gitee ==="
          EXIST_FILES=$(curl -s -H "Authorization: token $GITEE_TOKEN" \
            "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/attach_files")
          
          echo "$EXIST_FILES" | jq -r '.[]?.id // empty' | while read -r file_id; do
            if [ -n "$file_id" ]; then
              echo "Deleting old file ID: $file_id"
              curl -s -X DELETE "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/attach_files/$file_id" \
                -H "Authorization: token $GITEE_TOKEN" > /dev/null
            fi
          done

          echo "=== Uploading attachments to Gitee ==="
          shopt -s nullglob
          ASSETS=(./release_assets/*)
          
          for asset in "${ASSETS[@]}"; do
            [ -f "$asset" ] || continue
            filename="$(basename "$asset")"
            echo "Uploading $filename..."

            curl -sS --connect-timeout 30 \
              --max-time 900 \
              --speed-limit 1000 \
              --speed-time 30 \
              --retry 3 \
              --retry-delay 5 \
              -X POST "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/attach_files" \
              -H "Authorization: token $GITEE_TOKEN" \
              -F "file=@$asset"
            echo " ✅ Upload complete."
          done

          echo "🎉 All sync steps completed successfully!"