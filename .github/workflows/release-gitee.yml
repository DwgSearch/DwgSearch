name: Sync Release to Gitee
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v2.19.0)'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.vars.outputs.tag }}"
          mkdir -p ./release_assets
          gh release download "$tag" --repo ${{ github.repository }} --dir ./release_assets --clobber
          echo "Downloaded assets:"
          ls -la ./release_assets/

      - name: Create Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: h1985/DwgSearch
        run: |
          # Get release info from GitHub
          if [ "${{ github.event_name }}" = "release" ]; then
            NAME="${{ github.event.release.name }}"
            BODY="${{ github.event.release.body }}"
          else
            NAME="DwgSearch $TAG"
            BODY=""
          fi

          # Create release on Gitee (or update if exists)
          echo "Creating/updating Gitee release for $TAG..."
          
          # Check if release exists
          echo "=== Checking existing release ==="
          RESPONSE=$(curl -s -X GET "https://gitee.com/api/v5/repos/$REPO/releases/tags/$TAG" \
            -H "Authorization: token $GITEE_TOKEN" \
            -H "Accept: application/json")
          echo "GET response: $RESPONSE"
          
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Release exists (id=$RELEASE_ID), updating..."
            curl -s -X PATCH "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID" \
              -H "Authorization: token $GITEE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg name "$NAME" --arg body "$BODY" '{name: $name, body: $body}')"
            
            # Delete existing assets
            ASSETS=$(curl -s -X GET "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/assets" \
              -H "Authorization: token $GITEE_TOKEN")
            echo "Existing assets: $ASSETS"
            echo "$ASSETS" | jq -r '.[].id' | while read asset_id; do
              curl -s -X DELETE "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/assets/$asset_id" \
                -H "Authorization: token $GITEE_TOKEN"
            done
          else
            echo "Creating new release..."
            RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/$REPO/releases" \
              -H "Authorization: token $GITEE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg tag "$TAG" --arg name "$NAME" --arg body "$BODY" '{tag_name: $tag, name: $name, body: $body, prerelease: false}')")
            echo "POST response: $RESPONSE"
            RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
            echo "Created release id=$RELEASE_ID"
            
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              echo "❌ Failed to create release, check token permissions and repo path"
              exit 1
            fi
          fi

          # Upload assets
          for asset in ./release_assets/*; do
            [ -f "$asset" ] || continue
            filename=$(basename "$asset")
            echo "Uploading $filename..."
            UPLOAD_RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/assets" \
              -H "Authorization: token $GITEE_TOKEN" \
              -F "file=@$asset" \
              -F "name=$filename")
            echo "Upload response: $UPLOAD_RESPONSE"
            echo "  Uploaded $filename"
          done
          
          echo "✅ Gitee release $TAG synced successfully"