name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v2.19.0)'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "❌ Release tag is empty"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.vars.outputs.tag }}"
          REPO="${{ github.repository }}"
          ASSET_DIR="./release_assets"

          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"

          echo "=== Downloading GitHub Release assets ==="
          echo "Repo: $REPO"
          echo "Tag: $TAG"

          if gh release download "$TAG" \
              --repo "$REPO" \
              --dir "$ASSET_DIR" \
              --clobber; then
            echo "Downloaded via gh CLI"
          else
            echo "⚠️ gh CLI download failed, falling back to GitHub REST API..."

            RELEASE_JSON=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG")

            ASSET_COUNT=$(echo "$RELEASE_JSON" | jq '.assets | length')

            if [ "$ASSET_COUNT" -eq 0 ]; then
              echo "No GitHub Release assets found."
            else
              echo "Found $ASSET_COUNT GitHub Release assets."

              echo "$RELEASE_JSON" |
                jq -r '.assets[] | [.url, .name] | @tsv' |
                while IFS=$'\t' read -r ASSET_URL ASSET_NAME; do
                  echo "Downloading $ASSET_NAME..."

                  curl -fsSL \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/octet-stream" \
                    "$ASSET_URL" \
                    -o "$ASSET_DIR/$ASSET_NAME"
                done
            fi
          fi

          echo
          echo "Downloaded assets:"
          ls -lah "$ASSET_DIR"

      - name: Sync Release and Assets to Gitee
        uses: yanglbme/gitee-release-action@v1.5.0
        with:
          server: https://gitee.com
          owner: h1985
          repo: DwgSearch
          tag: ${{ steps.vars.outputs.tag }}
          token: ${{ secrets.GITEE_TOKEN }}
          asset_path: ./release_assets/*