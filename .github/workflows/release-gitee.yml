name: Sync Release to Gitee
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v2.19.0)'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.vars.outputs.tag }}"
          mkdir -p ./release_assets
          
          # Try gh CLI first
          if gh release download "$tag" --repo ${{ github.repository }} --dir ./release_assets --clobber 2>/dev/null; then
            echo "Downloaded via gh CLI"
          else
            echo "gh CLI failed, falling back to REST API..."
            # Get asset URLs from release
            ASSETS=$(curl -s -H "Authorization: token ${{ github.token }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" | jq -r '.assets[].url')
            
            for asset_url in $ASSETS; do
              asset_name=$(curl -s -H "Authorization: token ${{ github.token }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "$asset_url" | jq -r '.name')
              echo "Downloading $asset_name..."
              curl -L -H "Authorization: token ${{ github.token }}" \
                -H "Accept: application/octet-stream" \
                -o "./release_assets/$asset_name" \
                "$asset_url"
            done
          fi
          
          echo "Downloaded assets:"
          ls -la ./release_assets/

      - name: Create Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: h1985/DwgSearch
          GH_RELEASE_NAME: ${{ github.event.release.name }}
          GH_RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          # Determine name/body from env vars
          if [ "${{ github.event_name }}" = "release" ]; then
            NAME="$GH_RELEASE_NAME"
            BODY="$GH_RELEASE_BODY"
          else
            NAME="DwgSearch $TAG"
            BODY="Automated sync from GitHub Release $TAG. See [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/$TAG) for details."
          fi

          # Write body to temp file for safe JSON encoding
          BODY_FILE=$(mktemp)
          printf '%s' "$BODY" > "$BODY_FILE"
          NAME_FILE=$(mktemp)
          printf '%s' "$NAME" > "$NAME_FILE"

          # Create release on Gitee (or update if exists)
          echo "Creating/updating Gitee release for $TAG..."
          
          # Check if release exists
          echo "=== Checking existing release ==="
          RESPONSE=$(curl -s -X GET "https://gitee.com/api/v5/repos/$REPO/releases/tags/$TAG" \
            -H "Authorization: token $GITEE_TOKEN" \
            -H "Accept: application/json")
          echo "GET response: $RESPONSE"
          
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Release exists (id=$RELEASE_ID), updating..."
            # Use --rawfile to safely read body from file
            curl -s -X PATCH "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID" \
              -H "Authorization: token $GITEE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg name "$NAME" --rawfile body "$BODY_FILE" '{name: $name, body: $body}')"
            
            # Delete existing assets
            ASSETS=$(curl -s -X GET "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/assets" \
              -H "Authorization: token $GITEE_TOKEN")
            echo "Existing assets: $ASSETS"
            echo "$ASSETS" | jq -r '.[].id' | while read asset_id; do
              curl -s -X DELETE "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/assets/$asset_id" \
                -H "Authorization: token $GITEE_TOKEN"
            done
          else
            echo "Creating new release..."
            RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/$REPO/releases" \
              -H "Authorization: token $GITEE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg tag "$TAG" --arg name "$NAME" --rawfile body "$BODY_FILE" --arg target "main" '{tag_name: $tag, name: $name, body: $body, prerelease: false, target_commitish: $target}')")
            echo "POST response: $RESPONSE"
            RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
            echo "Created release id=$RELEASE_ID"
            
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              echo "❌ Failed to create release, check token permissions and repo path"
              rm -f "$BODY_FILE" "$NAME_FILE"
              exit 1
            fi
            
            # Wait for release to be ready (Gitee sometimes needs a moment)
            echo "Waiting for release to be ready..."
            for i in {1..10}; do
              CHECK=$(curl -s -X GET "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID" \
                -H "Authorization: token $GITEE_TOKEN" \
                -H "Accept: application/json")
              CHECK_ID=$(echo "$CHECK" | jq -r '.id // empty')
              if [ "$CHECK_ID" = "$RELEASE_ID" ]; then
                echo "Release confirmed ready"
                break
              fi
              echo "  Waiting... ($i/10)"
              sleep 2
            done
          fi

          # Verify release exists before uploading
          echo "=== Verifying release before upload ==="
          VERIFY=$(curl -s -X GET "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID" \
            -H "Authorization: token $GITEE_TOKEN" \
            -H "Accept: application/json")
          VERIFY_ID=$(echo "$VERIFY" | jq -r '.id // empty')
          if [ "$VERIFY_ID" != "$RELEASE_ID" ]; then
            echo "❌ Release verification failed: $VERIFY"
            rm -f "$BODY_FILE" "$NAME_FILE"
            exit 1
          fi
          echo "Release verified: $RELEASE_ID"

          # Upload assets
          for asset in ./release_assets/*; do
            [ -f "$asset" ] || continue
            filename=$(basename "$asset")
            echo "Uploading $filename..."
            
            # Upload with explicit status code capture
            UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/assets" \
              -H "Authorization: token $GITEE_TOKEN" \
              -F "file=@$asset" \
              -F "name=$filename")
            
            HTTP_CODE=$(echo "$UPLOAD_RESPONSE" | tail -n1)
            UPLOAD_BODY=$(echo "$UPLOAD_RESPONSE" | head -n -1)
            
            echo "Upload HTTP status: $HTTP_CODE"
            echo "Upload response: $UPLOAD_BODY"
            
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "  ✅ Uploaded $filename"
            else
              echo "  ❌ Upload failed for $filename (HTTP $HTTP_CODE)"
              echo "  Response: $UPLOAD_BODY"
              # Don't exit, try other assets
            fi
          done

          # Cleanup temp files
          rm -f "$BODY_FILE" "$NAME_FILE"
          
          echo "✅ Gitee release $TAG synced successfully"