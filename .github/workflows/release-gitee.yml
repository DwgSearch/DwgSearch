name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v2.19.0)'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "❌ Release tag is empty"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Sync Release and Attachments to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: h1985/DwgSearch
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Fetching GitHub Release Details ==="
          RELEASE_JSON=$(curl -fsSL "https://api.github.com/repos/$GH_REPO/releases/tags/$TAG")
          
          RELEASE_NAME=$(echo "$RELEASE_JSON" | jq -r '.name // "$TAG"')
          RELEASE_BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""')

          # 附加 GitHub 下载源提示信息
          APPEND_BODY=$'\n\n---\n*Note: Sync from GitHub Release. If attachment download is slow on Gitee, please download directly from [GitHub Release](https://github.com/'"$GH_REPO"'/releases/tag/'"$TAG"').*'
          FULL_BODY="${RELEASE_BODY}${APPEND_BODY}"

          echo "=== Syncing Release to Gitee ==="
          
          # 检查 Gitee 是否已存在 Release
          CHECK_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GITEE_TOKEN" \
            "https://gitee.com/api/v5/repos/$REPO/releases/tags/$TAG")

          if [ "$CHECK_CODE" -eq 200 ]; then
            echo "Release $TAG already exists on Gitee."
          else
            echo "Creating Release $TAG on Gitee..."
            
            # 提取所有附件的直链 URL
            ASSET_URLS=$(echo "$RELEASE_JSON" | jq -c '[.assets[].browser_download_url]')

            PAYLOAD=$(jq -n \
              --arg tag "$TAG" \
              --arg name "$RELEASE_NAME" \
              --arg body "$FULL_BODY" \
              --argjson attach_urls "$ASSET_URLS" \
              '{
                tag_name: $tag,
                name: $name,
                body: $body,
                prerelease: false,
                target_commitish: "main",
                attach_urls: $attach_urls
              }')

            RESPONSE=$(curl -s -X POST \
              "https://gitee.com/api/v5/repos/$REPO/releases" \
              -H "Authorization: token $GITEE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            echo "Gitee Release Sync Complete."
          fi